<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHL Jersey Bracket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="halves" id="halves"></div>

    <div class="center">
      <div class="toolbar">
        <span>Pick your favourite jerseys</span>
        <button id="reset" type="button">Reset</button>
      </div>
      <div class="center-top" id="center-top"></div>
      <div class="center-bottom" id="center-bottom"></div>
    </div>
  </main>

  <div class="popup" id="popup" role="dialog" hidden></div>

  <script src="app.js"></script>
</body>
</html>
